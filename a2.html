<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notification Toggle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

  <div class="space-x-6 text-sm font-medium flex items-center">
    <a href="#" class="hover:text-red-700">Home</a>
    <a href="#" class="hover:text-red-700">About us</a>
    <a href="#" class="hover:text-red-700">Contact</a>

    <!-- Bouton de notification -->
    <button onclick="toggleNotifications()" class="hover:text-red-700 focus:outline-none">
      Notification
    </button>
  </div>

  <!-- Bloc de notifications (caché par défaut) -->
  <div id="notifications" class="mt-4 hidden bg-white shadow-md p-4 rounded w-fit">
    <ul class="list-disc pl-5 text-sm text-gray-700">
      <li>Message 1</li>
      <li>Message 2</li>
      <li>Message 3</li>
    </ul>
  </div>

  <script>
    function toggleNotifications() {
      const box = document.getElementById('notifications');
      box.classList.remove('hidden');
    }
  </script>

</body>
</html>
